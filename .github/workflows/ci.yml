name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Companion Suite
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Test the version-tag guard
        run: bash scripts/test-check-version-tag.sh

      # The signing guard protects the one irreversible property in this project: the
      # certificate every published APK already carries. CI cannot exercise the real key
      # (each runner generates its own throwaway debug keystore), so it exercises the guard
      # itself against a fixture, which is what proves the guard fails closed.
      - name: Test the release-signing identity guard
        run: bash scripts/test-check-release-signing-identity.sh

      # A one-line label that does not fit its surface renders as "Rhythm and…",
      # which silently renames the card. Fail the build instead.
      - name: Test and run the watch-string audit
        run: |
          python3 scripts/test-audit-watch-strings.py
          python3 scripts/audit-watch-strings.py

      # Lint is the only check that inspects the manifest and the resource table rather than the
      # Kotlin. It was disabled here, and the first run found a theme that required API 29 under
      # a minSdk of 26, two activity-result registrations sitting on a fragment version too old
      # to defer to them, and thirteen resource strings whose literal percent sign would throw
      # the moment anything formatted them. Errors fail this step; warnings do not.
      - name: Run Android Lint
        run: ./gradlew :mobile:lintDebug :wear:lintDebug --no-daemon

      - name: Run Unit Tests & Assemble Debug APKs
        run: ./gradlew :mobile:testDebugUnitTest :wear:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug --no-daemon

      # The test loop is an artifact, not a release: any push produces installable
      # APKs that can be downloaded on a phone from the run page and thrown away
      # afterwards. Tagging is reserved for versions that earned it.
      - name: Upload Debug APKs for On-Device Testing
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks-${{ github.sha }}
          path: |
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
