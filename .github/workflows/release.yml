name: Release Gate

# Every release tag has to prove it can exist: the tag must name the version in
# version.properties, the unit tests must pass, and both release APKs must
# assemble. This workflow publishes nothing on its own — see RELEASING.md for the
# signing decision that still has to be made before automation may publish.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to rehearse the gate against (for example v1.9.25)'
        required: true
        type: string

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate (${{ github.ref_name }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Test the version-tag guard
        run: bash scripts/test-check-version-tag.sh

      # Exercised here too, because this is the workflow whose artifacts someone might
      # mistake for a publishable release. The runner's keystore is a fresh throwaway, so
      # the only thing that can be checked on CI is that the guard still fails closed.
      - name: Test the release-signing identity guard
        run: bash scripts/test-check-release-signing-identity.sh

      # Always runs: on a tag push it reads the tag being pushed, and on a manual
      # rehearsal it reads the tag typed into the input. A dispatch that skipped
      # this step would produce release APKs with no tag gate at all.
      - name: Verify the tag names the version in version.properties
        env:
          REHEARSAL_TAG: ${{ inputs.tag }}
        run: bash scripts/check-version-tag.sh "${REHEARSAL_TAG:-$GITHUB_REF_NAME}"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :mobile:testDebugUnitTest :wear:testDebugUnitTest --no-daemon

      - name: Assemble Release APKs
        run: ./gradlew :mobile:assembleRelease :wear:assembleRelease --no-daemon

      - name: Upload Release Candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-apks-${{ github.ref_name }}
          path: |
            mobile/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
