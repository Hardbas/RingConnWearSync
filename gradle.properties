org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# org.gradle.java.home is deliberately not set here: an absolute JDK path is
# machine-specific and breaks CI and every other machine. Point your own toolchain
# at JDK 21 through JAVA_HOME or a user-level ~/.gradle/gradle.properties instead.
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
