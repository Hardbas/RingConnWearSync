# The certificate every published release is signed with.
#
# Android refuses to update an app whose new APK carries a different signature,
# so this value is the update path for everyone who already installed one. It is
# read by scripts/check-release-signing-identity.sh and printed in README.md
# under "Verifying your download"; if the two ever disagree, the file wins and
# the README is wrong.
#
# It is a public value: it is the certificate, not the private key. The key
# itself is the debug keystore at ~/.android/debug.keystore, which is why
# RELEASING.md's backup section exists.
releaseCertSha256=1ccf5348ff46a919620d806faa9a5e0e9d857bc74fdb643809ea3108827f1372
